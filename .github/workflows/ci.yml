name: CI

on:
  pull_request:
  push:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Runners are pinned to ubuntu-24.04 (ubuntu-latest moves to Ubuntu 26 from 2026-10-19) and actions to commit
# SHAs, which Dependabot keeps current.
jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # uv's CPython 3.15 (python-build-standalone) is built with the JIT, like the services' base image;
      # setup-python's builds don't promise it.
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          python-version: "3.15"
          activate-environment: true
      - name: Validate gzip integrity
        run: gzip --test epg.xml.gz
      - name: Validate XMLTV content
        env:
          PYTHON_JIT: "1"
        run: |
          python - <<'PY'
          import gzip
          import sys
          import xml.etree.ElementTree as ET

          if not sys._jit.is_enabled():
              raise SystemExit(f"Expected CPython with the JIT on, got {sys.version}")

          root = None
          channels = 0
          programmes = 0
          with gzip.open("epg.xml.gz", "rb") as stream:
              for _, element in ET.iterparse(stream, events=("start",)):
                  tag = element.tag.rsplit("}", 1)[-1]
                  if root is None:
                      root = tag
                  elif tag == "channel":
                      channels += 1
                  elif tag == "programme":
                      programmes += 1

          if root != "tv":
              raise SystemExit(f"Expected XMLTV root 'tv', got {root!r}")
          if channels == 0 or programmes == 0:
              raise SystemExit(
                  f"Expected channels and programmes, got {channels} channels and {programmes} programmes"
              )
          print(f"Validated {channels} channels and {programmes} programmes")
          PY
